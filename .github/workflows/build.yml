name: Gerar app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Mac (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilar o transcritor (whisper.cpp com Metal)
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp wsrc
          cmake -S wsrc -B wbuild -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF             -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF             -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build wbuild --config Release -j 4 --target whisper-cli
          cp wbuild/bin/whisper-cli vendor/whisper/
          codesign --force --sign - vendor/whisper/whisper-cli
          otool -L vendor/whisper/whisper-cli
          vendor/whisper/whisper-cli --help | head -3
      - run: npx electron-builder --mac --arm64 --publish never
      - name: Assinatura local (ad-hoc), DMG e ZIP
        run: |
          APP="dist/mac-arm64/RefLab.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname RefLab -srcfolder dmg -ov -format UDZO RefLab-mac-arm64.dmg
          ditto -c -k --keepParent "$APP" RefLab-mac-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RefLab-mac-arm64
          path: |
            RefLab-mac-arm64.dmg
            RefLab-mac-arm64.zip
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            RefLab-mac-arm64.dmg
            RefLab-mac-arm64.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: RefLab-windows
          path: dist/RefLab-Setup-*.exe
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/RefLab-Setup-*.exe
