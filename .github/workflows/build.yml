name: Gerar app

on:
  push:
    # versao-layout-b: só gera os builds (Mac e Windows) para validar antes do merge; publicar continua só em tag
    branches: [main, versao-layout-b]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Mac (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilar o transcritor (whisper.cpp com Metal)
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp wsrc
          cmake -S wsrc -B wbuild -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF             -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF             -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build wbuild --config Release -j 4 --target whisper-cli whisper-vad-speech-segments
          cp wbuild/bin/whisper-cli wbuild/bin/whisper-vad-speech-segments vendor/whisper/
          codesign --force --sign - vendor/whisper/whisper-cli vendor/whisper/whisper-vad-speech-segments
          otool -L vendor/whisper/whisper-cli vendor/whisper/whisper-vad-speech-segments
          vendor/whisper/whisper-cli --help | head -3
          vendor/whisper/whisper-vad-speech-segments --help 2>&1 | head -3
      - name: ffmpeg para o Mac (vai dentro do app)
        run: |
          baixar() {
            nome="$1"; shift
            for url in "$@"; do
              for tentativa in 1 2 3 4; do
                rm -rf tmp-ff && mkdir tmp-ff
                if curl -fsSL --max-time 300 -o tmp-ff/p.zip "$url" && unzip -o -q tmp-ff/p.zip -d tmp-ff/x; then
                  achado=$(find tmp-ff/x -type f -name "$nome" ! -path "*__MACOSX*" | head -1)
                  if [ -n "$achado" ]; then cp "$achado" "vendor/ffmpeg/$nome"; return 0; fi
                fi
                sleep 15
              done
            done
            return 1
          }
          baixar ffmpeg https://www.osxexperts.net/ffmpeg9arm.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          baixar ffprobe https://www.osxexperts.net/ffprobe9arm.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip
          chmod +x vendor/ffmpeg/ffmpeg vendor/ffmpeg/ffprobe
          xattr -cr vendor/ffmpeg || true
          codesign --force --sign - vendor/ffmpeg/ffmpeg vendor/ffmpeg/ffprobe
          vendor/ffmpeg/ffmpeg -hide_banner -version | head -1
          vendor/ffmpeg/ffmpeg -hide_banner -filters | grep -E " ass " || (echo "ffmpeg sem filtro ass" && exit 1)
          vendor/ffmpeg/ffmpeg -hide_banner -encoders | grep -E "libx264|hevc_videotoolbox|prores_ks"
      - run: npx electron-builder --mac --arm64 --publish never
      - name: Assinatura local (ad-hoc), DMG e ZIP
        run: |
          APP="dist/mac-arm64/RefLab.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname RefLab -srcfolder dmg -ov -format UDZO RefLab-mac-arm64.dmg
          ditto -c -k --keepParent "$APP" RefLab-mac-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RefLab-mac-arm64
          path: |
            RefLab-mac-arm64.dmg
            RefLab-mac-arm64.zip
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            RefLab-mac-arm64.dmg
            RefLab-mac-arm64.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: RefLab-windows
          path: dist/RefLab-Setup-*.exe
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/RefLab-Setup-*.exe
